{% extends "base.html" %}

{% block title %}Add bicycle - VeloFix{% endblock %}

{% block content %}
<h1 class="h3 mb-1">Add bicycle</h1>
<p class="text-muted mb-3">Owner: {{ customer.full_name }}</p>

<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}
        <div class="text-danger small">{{ error }}</div>
      {% endfor %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ customer.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
