{% extends "base.html" %}

{% block title %}New customer - VeloFix{% endblock %}

{% block content %}
<h1 class="h3 mb-3">New customer</h1>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
        {% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'customer-list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
