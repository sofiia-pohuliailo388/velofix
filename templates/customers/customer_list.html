{% extends "base.html" %}

{% block title %}Customers - VeloFix{% endblock %}

{% block content %}
<h1 class="h3 mb-3">List of Customers</h1>
<ul>
  {% for customer in customers %}
    <li>{{ customer.full_name }} - {{ customer.phone }}</li>
  {% empty %}
    <li>No customers yet.</li>
  {% endfor %}
</ul>
{% endblock %}
